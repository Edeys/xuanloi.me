name: Deploy to xuanloi.me (DNCloud FTP)

# Workflow: local code -> push main -> CI (lint + build) xanh -> job deploy mới chạy.
# PR chỉ chạy lint + build (astro-build.yml, lint.yml), không deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-xuanloi
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  ASTRO_TELEMETRY_DISABLED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run lint and format check
        run: pnpm run check

  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Astro site
        run: pnpm run build
      - name: Check build output
        run: ls -la dist/
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Sync dist to DNCloud via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          server-dir: /public_html/
          exclude: |
            **/.DS_Store

      - name: Verify deploy
        run: |
          echo "=== robots.txt ==="
          curl -sI https://xuanloi.me/robots.txt | head -3
          echo "=== llms.txt ==="
          curl -sI https://xuanloi.me/llms.txt | head -3
          echo "=== homepage ==="
          curl -sI https://xuanloi.me/ | head -3
